name: Backend Deploy

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.SERVER_HOST }}
      SSH_USER: ${{ secrets.SERVER_USER }}
      SSH_PORT: ${{ secrets.SERVER_PORT }}
      SSH_KEY: ${{ secrets.SERVER_PRIVATE_KEY }}
      BACKEND_DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}
      BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build OpenMAIC image
        run: |
          docker build \
            --build-arg NODE_IMAGE=node:22-alpine3.19 \
            --build-arg APK_MIRROR=mirrors.aliyun.com \
            --build-arg NPM_REGISTRY=https://registry.npmmirror.com \
            --build-arg NEXT_TELEMETRY_DISABLED=1 \
            --build-arg OPENMAIC_NODE_OPTIONS=--max-old-space-size=768 \
            -t aiedu-openmaic:latest \
            -f OpenMAIC/Dockerfile \
            OpenMAIC

      - name: Validate secrets
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Prune remote stale artifacts
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "BACKEND_DEPLOY_PATH='${BACKEND_DEPLOY_PATH}' sh -s" <<'REMOTE'
          set -eu

          BACKEND_DEPLOY_PATH="${BACKEND_DEPLOY_PATH:-/data/projects/Backend/deploy}"
          BACKEND_ROOT="$(dirname "$BACKEND_DEPLOY_PATH")"

          rm -rf \
            "$BACKEND_ROOT/OpenMAIC/assets" \
            "$BACKEND_ROOT/generatePicture"

          find "$BACKEND_ROOT" -type f \( -name '*.tmp' -o -name '*.swp' \) -delete
          REMOTE

      - name: Load OpenMAIC image to server
        run: |
          docker save aiedu-openmaic:latest | gzip -1 | ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "gunzip | docker load"

      - name: Upload backend source
        run: |
          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='*.env' \
            --exclude='deploy/.env' \
            --exclude='Agent-Do/data' \
            --exclude='Crawl/db' \
            --exclude='Crawl/logs' \
            --exclude='Crawl/static/page-shots' \
            --exclude='EduRepo/backend/data' \
            --exclude='OpenMAIC/.env.local' \
            --exclude='OpenMAIC/data' \
            --exclude='OpenMAIC/assets' \
            --exclude='WorkShop/state' \
            --exclude='generatePicture' \
            --exclude='**/__pycache__' \
            --exclude='**/.venv' \
            --exclude='**/node_modules' \
            --exclude='**/.next' \
            -czf - . | ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
              "BACKEND_DEPLOY_PATH='${BACKEND_DEPLOY_PATH}' sh -c 'set -eu; BACKEND_DEPLOY_PATH=\"\${BACKEND_DEPLOY_PATH:-/data/projects/Backend/deploy}\"; BACKEND_ROOT=\$(dirname \"\$BACKEND_DEPLOY_PATH\"); mkdir -p \"\$BACKEND_ROOT\"; tar -xzf - -C \"\$BACKEND_ROOT\"'"

      - name: Install backend env file
        if: env.BACKEND_ENV_FILE != ''
        run: |
          printf '%s' "$BACKEND_ENV_FILE" | ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "BACKEND_DEPLOY_PATH='${BACKEND_DEPLOY_PATH}' sh -c 'set -eu; BACKEND_DEPLOY_PATH=\"\${BACKEND_DEPLOY_PATH:-/data/projects/Backend/deploy}\"; mkdir -p \"\$BACKEND_DEPLOY_PATH\"; umask 077; cat > \"\$BACKEND_DEPLOY_PATH/.env.tmp\"; mv \"\$BACKEND_DEPLOY_PATH/.env.tmp\" \"\$BACKEND_DEPLOY_PATH/.env\"'"

      - name: Deploy backend services
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "BACKEND_DEPLOY_PATH='${BACKEND_DEPLOY_PATH}' OPENMAIC_PUBLIC_ORIGIN_OVERRIDE='http://${SSH_HOST}:3000' OPENMAIC_NODE_OPTIONS_OVERRIDE='--max-old-space-size=768' OPENMAIC_SKIP_BUILD_OVERRIDE='1' DEPLOY_SWAP_SIZE_MB_OVERRIDE='8192' bash -s" <<'REMOTE'
          set -euo pipefail

          BACKEND_DEPLOY_PATH="${BACKEND_DEPLOY_PATH:-/data/projects/Backend/deploy}"
          cd "$BACKEND_DEPLOY_PATH"

          if [ -f ./cloud-check.sh ]; then
            bash ./cloud-check.sh
          fi

          set -a
          source ./.env
          set +a

          chmod +x ./up.sh
          ./up.sh --force-recreate crawl-api agent-do workshop openmaic

          docker compose ps crawl-api agent-do workshop openmaic || true

          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${OPENMAIC_PORT:-3000}/api/health" >/dev/null; then
              echo "OpenMAIC health check passed."
              exit 0
            fi
            sleep 2
          done

          echo "OpenMAIC health check failed." >&2
          docker compose logs --tail 80 openmaic >&2 || true
          exit 1
          REMOTE

      - name: Verify public OpenMAIC endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "http://${SSH_HOST}:3000/api/health" >/dev/null; then
              echo "Public OpenMAIC endpoint check passed."
              exit 0
            fi
            sleep 2
          done

          echo "Public OpenMAIC endpoint check failed. Check the Alibaba Cloud security group/firewall for TCP 3000." >&2
          exit 1
